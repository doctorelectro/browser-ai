name: Deploy to Azure

on:
  push:
    branches: [ main ]

env:
  AZURE_RESOURCE_GROUP: 'doctorai-rg'
  AZURE_APP_NAME: 'doctorai-app'
  NEXT_PUBLIC_API_URL: 'https://doctorai-app.azurewebsites.net'
  NODE_ENV: 'production'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install --prefix backend --legacy-peer-deps --omit=dev
    
    - name: Build frontend
      run: npm run build --workspace=browser-ai-frontend
    
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Deploy to App Service
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_APP_NAME }}
        package: .
    
    - name: Configure App Service
      run: |
        az webapp config set \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --name ${{ env.AZURE_APP_NAME }} \
          --startup-file "npm start --workspace=browser-ai-backend"
          az webapp config appsettings set \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AZURE_APP_NAME }} \
            --settings \
              NODE_ENV="production" \
              PORT="8080" \
              FRONTEND_URL="https://doctorai-app.azurewebsites.net" \
              AZURE_OPENAI_API_KEY="${{ secrets.AZURE_OPENAI_API_KEY }}" \
              AZURE_OPENAI_ENDPOINT="${{ secrets.AZURE_OPENAI_ENDPOINT }}" \
              AZURE_OPENAI_DEPLOYMENT_NAME="${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}" \
              GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
              GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"
    
    - name: Restart App Service
      run: az webapp restart --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --name ${{ env.AZURE_APP_NAME }}
