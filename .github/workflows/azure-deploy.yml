name: Deploy to Azure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AZURE_RESOURCE_GROUP: 'doctorai-rg'
  AZURE_APP_NAME: 'doctorai-app'
  NEXT_PUBLIC_API_URL: 'https://doctorai-app.azurewebsites.net'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install --workspaces --legacy-peer-deps
    
    - name: Build frontend
      run: npm run build --workspace=browser-ai-frontend
    
    - name: Lint backend (optional)
      run: npm run lint --workspace=browser-ai-backend || true
    
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_APP_NAME }}
        package: .
    
    - name: Set startup command
      run: |
        az webapp config set \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --name ${{ env.AZURE_APP_NAME }} \
          --startup-file "npm start --workspace=browser-ai-backend"
    
    - name: Logout from Azure
      run: az logout || true
